name: Validate Authtics Findings

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'findings/npm/**/*.json'

permissions:
  contents: read

jobs:
  validate:
    name: Findings review gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Validate findings
        run: |
          set -euo pipefail
          mapfile -t files < <(find findings/npm -type f -name 'AUTH-*.json' -print 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No current npm advisory findings found."
            exit 0
          fi
          python3 scripts/validate_findings.py "${files[@]}"
