name: Validate Authtics Findings

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'findings/npm/**/*.json'
      - 'findings/pypi/**/*.json'

permissions:
  contents: read

jobs:
  validate:
    name: Findings review gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Validate findings
        run: |
          set -euo pipefail
          files=()
          for ecosystem in npm pypi; do
            if [ -d "findings/$ecosystem" ]; then
              while IFS= read -r file; do
                files+=("$file")
              done < <(find "findings/$ecosystem" -type f -name 'AUTH-*.json' -print)
            fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No current advisory findings found."
            exit 0
          fi
          python3 scripts/validate_findings.py "${files[@]}"
