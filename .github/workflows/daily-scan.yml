name: Daily Authtics Package Scan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repository directories
        run: |
          mkdir -p \
            packages \
            findings \
            metadata \
            scripts \
            schemas

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured."
            exit 1
          fi

          echo "Gemini API key is configured."

      - name: Fetch recently published npm packages
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://registry.npmjs.org/-/all"

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Authtics/0.1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)

          packages = []

          for name, package in data.items():
              time_data = package.get("time", {})

              if not time_data:
                  continue

              created = time_data.get("created")

              if not created:
                  continue

              versions = [
                  version
                  for version in time_data
                  if version not in ("created", "modified")
              ]

              for version in versions:
                  published = time_data.get(version)

                  if published:
                      packages.append({
                          "name": name,
                          "version": version,
                          "published": published
                      })

          packages.sort(
              key=lambda package: package["published"],
              reverse=True
          )

          selected = packages[:5]

          with open("metadata/recent-packages.json", "w") as f:
              json.dump(selected, f, indent=2)

          print("Selected packages:")

          for package in selected:
              print(
                  f'{package["published"]} '
                  f'{package["name"]}@{package["version"]}'
              )
          PY

      - name: Show selected packages
        run: |
          cat metadata/recent-packages.json

      - name: Commit package metadata
        run: |
          git config user.name "Authtics Bot"
          git config user.email "authtics-bot@users.noreply.github.com"

          git add metadata/recent-packages.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git commit -m "chore: update recent npm packages"
          git push
