name: Daily Authtics Package Scan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repository directories
        run: |
          mkdir -p packages/npm findings metadata scripts schemas

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured."
            exit 1
          fi
          echo "Gemini API key is configured."

      - name: Fetch newest npm packages
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({"text": "javascript", "size": 250, "from": 0})
          url = f"https://registry.npmjs.org/-/v1/search?{params}"
          request = urllib.request.Request(url, headers={
              "Accept": "application/json",
              "User-Agent": "Authtics/0.1.0"
          })

          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)

          packages = []
          for result in data.get("objects", []):
              package = result.get("package", {})
              name = package.get("name")
              version = package.get("version")
              published = package.get("date")
              if name and version and published:
                  packages.append({"name": name, "version": version, "published": published})

          packages.sort(key=lambda package: package["published"], reverse=True)
          selected = packages[:5]
          with open("metadata/recent-packages.json", "w") as file:
              json.dump(selected, file, indent=2)

          for index, package in enumerate(selected, 1):
              print(f'{index}. {package["name"]}@{package["version"]} ({package["published"]})')
          PY

      - name: Download package sources
        run: |
          set -e
          rm -rf /tmp/authtics-packages
          mkdir -p /tmp/authtics-packages

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          packages = json.loads(Path("metadata/recent-packages.json").read_text())
          for package in packages:
              name = package["name"]
              version = package["version"]
              destination = Path("packages/npm") / name / version

              if destination.exists() and any(destination.iterdir()):
                  print(f"Already stored: {name}@{version}")
                  continue

              destination.mkdir(parents=True, exist_ok=True)
              temp = Path("/tmp/authtics-packages") / f"{name.replace('/', '__')}-{version}"
              temp.mkdir(parents=True, exist_ok=True)

              print(f"Downloading {name}@{version}...")
              subprocess.run([
                  "npm", "pack", f"{name}@{version}",
                  "--pack-destination", str(temp)
              ], check=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)

              tarballs = list(temp.glob("*.tgz"))
              if len(tarballs) != 1:
                  raise RuntimeError(f"Expected one tarball for {name}@{version}, found {len(tarballs)}")

              subprocess.run([
                  "tar", "-xzf", str(tarballs[0]),
                  "--strip-components=1", "-C", str(destination)
              ], check=True)
              print(f"Stored: {destination}")
          PY

      - name: Analyze packages with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.7-flash
        run: python3 scripts/gemini_analyze.py

      - name: Show generated findings
        run: |
          echo "================================"
          echo "Generated Gemini drafts"
          echo "================================"
          find findings -type f -name '*.json' -print -exec cat {} \;

      - name: Commit package data and findings
        run: |
          git config user.name "Authtics Bot"
          git config user.email "authtics-bot@users.noreply.github.com"
          git add packages findings metadata/recent-packages.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: scan recent npm packages with Gemini"
          git push
