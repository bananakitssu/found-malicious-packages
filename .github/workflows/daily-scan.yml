name: Daily Authtics Package Scan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repository directories
        run: |
          mkdir -p \
            packages \
            findings \
            metadata \
            scripts \
            schemas

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured."
            exit 1
          fi

          echo "Gemini API key is configured."

      - name: Fetch 5 newest npm packages
        run: |
          python3 - <<'PY'
          import json
          import urllib.request

          url = "https://registry.npmjs.org/-/v1/search?text=*&size=250"

          with urllib.request.urlopen(url) as response:
              data = json.load(response)

          packages = []

          for result in data.get("objects", []):
              package = result.get("package", {})

              name = package.get("name")
              version = package.get("version")
              published = package.get("date")

              if name and version and published:
                  packages.append({
                      "name": name,
                      "version": version,
                      "published": published
                  })

          packages.sort(
              key=lambda package: package["published"],
              reverse=True
          )

          selected = packages[:5]

          with open("metadata/recent-packages.json", "w") as f:
              json.dump(selected, f, indent=2)

          print("Selected packages:")

          for package in selected:
              print(
                  f'{package["published"]} '
                  f'{package["name"]}@{package["version"]}'
              )
          PY

      - name: Show selected packages
        run: |
          cat metadata/recent-packages.json

      - name: Commit package metadata
        run: |
          git config user.name "Authtics Bot"
          git config user.email "authtics-bot@users.noreply.github.com"

          git add metadata/recent-packages.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git commit -m "chore: update recent npm packages"
          git push
