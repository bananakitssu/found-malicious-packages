name: Daily Authtics Package Scan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  AUTHTICS_PACKAGE_LIMIT: 100
  GEMINI_MODEL: gemini-3.1-flash-lite
  GEMINI_FALLBACK_MODELS: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-flash-lite-latest

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create working directories
        run: mkdir -p reports findings metadata /tmp/authtics-packages/extracted

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY is not configured."; exit 1; fi
          echo "Gemini API key is configured."

      - name: Fetch newest npm packages
        env:
          AUTHTICS_PACKAGE_LIMIT: 100
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, os
          limit = int(os.environ.get("AUTHTICS_PACKAGE_LIMIT", "100"))
          page_size = 250
          packages = []
          for offset in range(0, limit, page_size):
              size = min(page_size, limit - offset)
              params = urllib.parse.urlencode({"text": "javascript", "size": size, "from": offset})
              url = f"https://registry.npmjs.org/-/v1/search?{params}"
              request = urllib.request.Request(url, headers={"Accept":"application/json","User-Agent":"Authtics/0.1.0"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = json.load(response)
              for result in data.get("objects", []):
                  package = result.get("package", {})
                  if package.get("name") and package.get("version") and package.get("date"):
                      packages.append({"name": package["name"], "version": package["version"], "published": package["date"]})
              if len(data.get("objects", [])) < size:
                  break
          packages.sort(key=lambda p: p["published"], reverse=True)
          selected = []
          seen = set()
          for package in packages:
              key = (package["name"], package["version"])
              if key in seen:
                  continue
              seen.add(key)
              selected.append(package)
              if len(selected) >= limit:
                  break
          with open("metadata/recent-packages.json", "w") as file: json.dump(selected, file, indent=2)
          print(f"Selected {len(selected)} npm package versions for analysis (target: {limit}).")
          for i, p in enumerate(selected, 1): print(f'{i}. {p["name"]}@{p["version"]} ({p["published"]})')
          PY

      - name: Download package sources
        run: |
          set -e
          rm -rf /tmp/authtics-packages/extracted
          mkdir -p /tmp/authtics-packages/extracted
          python3 - <<'PY'
          import json, tarfile, urllib.request, time
          from pathlib import Path
          packages = json.loads(Path("metadata/recent-packages.json").read_text())
          for index, package in enumerate(packages, 1):
              name, version = package["name"], package["version"]
              destination = Path("/tmp/authtics-packages/extracted") / name / version
              destination.mkdir(parents=True, exist_ok=True)
              metadata_url = "https://registry.npmjs.org/" + name.replace("/", "%2F")
              request = urllib.request.Request(metadata_url, headers={"Accept":"application/json","User-Agent":"Authtics/0.1.0"})
              with urllib.request.urlopen(request, timeout=60) as response: metadata = json.load(response)
              version_data = metadata.get("versions", {}).get(version)
              if not version_data or not version_data.get("dist", {}).get("tarball"):
                  raise RuntimeError(f"Tarball metadata not found for {name}@{version}")
              tarball_path = Path("/tmp/authtics-packages") / f"{name.replace('/', '__')}-{version}.tgz"
              print(f"[{index}/{len(packages)}] Downloading {name}@{version}...")
              urllib.request.urlretrieve(version_data["dist"]["tarball"], tarball_path)
              with tarfile.open(tarball_path, "r:gz") as archive:
                  root = Path("package")
                  for member in archive.getmembers():
                      member_path = Path(member.name)
                      if not member_path.parts or member_path.parts[0] != "package": continue
                      relative = member_path.relative_to(root)
                      if any(part in {"..", ""} for part in relative.parts): continue
                      target = destination / relative
                      if member.isdir(): target.mkdir(parents=True, exist_ok=True); continue
                      if not member.isfile(): continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = archive.extractfile(member)
                      if source is not None: target.write_bytes(source.read())
              print(f"Stored for analysis: {destination}")
              tarball_path.unlink(missing_ok=True)
              if index % 25 == 0: time.sleep(1)
          PY

      - name: Analyze packages with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-flash-lite-latest
          AUTHTICS_PACKAGE_ROOT: /tmp/authtics-packages/extracted
        run: python3 scripts/run_gemini_analyze.py

      - name: Remove package workspace after static analysis
        if: always()
        run: |
          echo "Removing downloaded package sources and temporary analysis files..."
          rm -rf /tmp/authtics-packages/extracted
          rm -f /tmp/authtics-packages/*.tgz
          mkdir -p /tmp/authtics-packages/extracted
          echo "Package workspace cleaned."

      - name: Classify CWE candidates
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.1-flash-lite
          GEMINI_FALLBACK_MODELS: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-flash-lite-latest
        run: python3 scripts/classify_cwe.py

      - name: Check for actionable findings
        id: findings
        run: |
          if [ -z "$(find findings/npm -type f -name 'AUTH-*.json' -print -quit 2>/dev/null)" ]; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "No actionable findings. Nothing will be committed or submitted as a PR."
          else
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Show generated report and advisories
        if: steps.findings.outputs.has_findings == 'true'
        run: |
          find reports -type f -name '*.md' -print -exec cat {} \;
          echo "================================"
          find findings/npm -type f -name 'AUTH-*.json' -print -exec cat {} \;

      - name: Create review branch and pull request
        if: steps.findings.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "Authtics Bot"
          git config user.email "authtics-bot@users.noreply.github.com"
          BASE_BRANCH="${{ github.event.repository.default_branch }}"
          BRANCH="authtics/daily-scan-${GITHUB_RUN_ID}"
          git checkout -b "$BRANCH"
          git add reports/*.md findings/npm metadata/recent-packages.json metadata/scan-state.json
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "security: add daily npm advisories for review"
          git push --set-upstream origin "$BRANCH"
          REPORT=$(find reports -type f -name '*.md' | sort | tail -n 1)
          printf '%s\n' \
            '## Authtics Advisories — Human Review Required' \
            '' \
            'This draft contains only actionable findings. Results rated `n/a` are omitted.' \
            '' \
            '- Severity uses `critical`, `high`, `medium`, `low`, or `n/a`.' \
            '- `n/a` results never create advisory files, commits, or pull requests by themselves.' \
            '- AI analysis is a draft only.' \
            '- CWE IDs are AI-proposed classifications and must be verified by the human reviewer.' \
            '- No package code was executed during analysis.' \
            '- Verify the exact package version before publication.' \
            '' \
            "### Report" \
            "- \`$REPORT\`" \
            > /tmp/authtics-pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$BRANCH" --title "security: Authtics daily npm advisories" --body-file /tmp/authtics-pr-body.md --draft
