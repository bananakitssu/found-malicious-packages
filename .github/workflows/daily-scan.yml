name: Daily Authtics Package Scan

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repository directories
        run: |
          mkdir -p packages
          mkdir -p findings
          mkdir -p metadata
          mkdir -p scripts
          mkdir -p schemas

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured."
            exit 1
          fi

          echo "Gemini API key is configured."

      - name: Fetch newest npm packages
        run: |
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          params = urllib.parse.urlencode({
              "text": "javascript",
              "size": 250,
              "from": 0
          })

          url = f"https://registry.npmjs.org/-/v1/search?{params}"

          print(f"Requesting npm Registry API...")

          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "Authtics/0.1.0"
              }
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              data = json.load(response)

          packages = []

          for result in data.get("objects", []):
              package = result.get("package", {})

              name = package.get("name")
              version = package.get("version")
              published = package.get("date")

              if not name or not version or not published:
                  continue

              packages.append({
                  "name": name,
                  "version": version,
                  "published": published
              })

          packages.sort(
              key=lambda package: package["published"],
              reverse=True
          )

          selected = packages[:5]

          with open("metadata/recent-packages.json", "w") as file:
              json.dump(selected, file, indent=2)

          print()
          print("Newest 5 packages returned by npm:")
          print()

          for index, package in enumerate(selected, 1):
              print(
                  f'{index}. '
                  f'{package["name"]}@{package["version"]} '
                  f'({package["published"]})'
              )
          PY

      - name: Show package metadata
        run: |
          echo "================================"
          echo "Recent npm packages"
          echo "================================"
          cat metadata/recent-packages.json

      - name: Commit package metadata
        run: |
          git config user.name "Authtics Bot"
          git config user.email "authtics-bot@users.noreply.github.com"

          git add metadata/recent-packages.json

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
            exit 0
          fi

          git commit -m "chore: update recent npm packages"
          git push
