name: Daily Authtics PyPI Scan

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  GEMINI_MODEL: gemini-3.1-flash-lite
  # Prefer models confirmed available to the configured Gemini account.
  # The analyzer skips unavailable models and moves on when a model quota is exhausted.
  GEMINI_FALLBACK_MODELS: gemini-2.5-flash,gemini-2.5-flash-lite,gemini-flash-lite-latest
  AUTHTICS_PYPI_PACKAGE_LIMIT: 100
  AUTHTICS_PACKAGE_ROOT: /tmp/authtics-packages/extracted

jobs:
  scan:
    name: Scan PyPI packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install scanner dependencies
        run: python3 -m pip install --disable-pip-version-check requests

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not configured."
            exit 1
          fi

      - name: Prepare workspace
        run: |
          mkdir -p reports findings metadata "$AUTHTICS_PACKAGE_ROOT"
          rm -rf "$AUTHTICS_PACKAGE_ROOT"/*

      - name: Discover recent PyPI releases
        env:
          PYPI_LIMIT: ${{ env.AUTHTICS_PYPI_PACKAGE_LIMIT }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen

          limit = int(os.environ.get("PYPI_LIMIT", "100"))
          rss_url = "https://pypi.org/rss/updates.xml"
          req = Request(rss_url, headers={"User-Agent": "Authtics/0.1.0"})
          with urlopen(req, timeout=30) as response:
              rss = response.read()

          root = ET.fromstring(rss)
          candidates = []
          seen = set()

          for item in root.iter():
              if item.tag.rsplit("}", 1)[-1] != "item":
                  continue
              link = None
              for child in item:
                  if child.tag.rsplit("}", 1)[-1] == "link" and child.text:
                      link = child.text.strip()
                      break
              if not link:
                  continue
              parsed = urlparse(link)
              parts = [part for part in parsed.path.split("/") if part]
              if len(parts) < 3 or parts[0] != "project":
                  continue
              name = parts[1]
              version = parts[2]
              key = (name.lower(), version)
              if key not in seen:
                  seen.add(key)
                  candidates.append((name, version))
              if len(candidates) >= limit:
                  break

          targets = []
          for name, feed_version in candidates:
              try:
                  req = Request(f"https://pypi.org/pypi/{name}/json", headers={"User-Agent": "Authtics/0.1.0"})
                  with urlopen(req, timeout=20) as response:
                      data = json.load(response)
                  info = data.get("info", {})
                  canonical_name = info.get("name")
                  version = info.get("version")
                  if not canonical_name or not version:
                      print(f"Skipping {name}@{feed_version}: missing canonical PyPI metadata")
                      continue
                  files = data.get("releases", {}).get(version, [])
                  source = next((f for f in files if f.get("packagetype") == "sdist"), None)
                  if source is None:
                      source = next((f for f in files if f.get("packagetype") == "bdist_wheel"), None)
                  if not source or not source.get("url") or not source.get("filename"):
                      print(f"Skipping {canonical_name}@{version}: no usable source artifact")
                      continue
                  targets.append({"name": canonical_name, "version": version, "filename": source["filename"], "url": source["url"], "packagetype": source["packagetype"]})
              except Exception as exc:
                  print(f"Skipping {name}@{feed_version}: {exc}")
              time.sleep(0.05)

          Path("metadata/pypi-recent-packages.json").write_text(
              json.dumps({"ecosystem": "PyPI", "generated": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()), "packages": targets}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Selected {len(targets)} recent PyPI package releases for analysis from the bounded update feed.")
          PY

      - name: Download and extract PyPI packages safely
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import tarfile
          import urllib.request
          import zipfile
          from pathlib import Path

          root = Path(os.environ["AUTHTICS_PACKAGE_ROOT"])
          metadata_path = Path("metadata/pypi-recent-packages.json")
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          targets = metadata["packages"]
          successful = []

          def safe_member(name):
              p = Path(name)
              return not p.is_absolute() and ".." not in p.parts

          def extract_tar(data, destination):
              with tarfile.open(fileobj=io.BytesIO(data), mode="r:*") as tf:
                  for member in tf.getmembers():
                      if not member.isfile() or not safe_member(member.name):
                          continue
                      target = destination / member.name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      src = tf.extractfile(member)
                      if src is None:
                          continue
                      with target.open("wb") as dst:
                          dst.write(src.read())

          def extract_zip(data, destination):
              with zipfile.ZipFile(io.BytesIO(data)) as zf:
                  for member in zf.infolist():
                      if member.is_dir() or not safe_member(member.filename):
                          continue
                      target = destination / member.filename
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(member) as src, target.open("wb") as dst:
                          dst.write(src.read())

          for index, item in enumerate(targets, 1):
              name = item["name"]
              version = item["version"]
              print(f"[{index}/{len(targets)}] Downloading {name}@{version}...")
              destination = root / name / version
              try:
                  request = urllib.request.Request(item["url"], headers={"User-Agent": "Authtics/0.1.0"})
                  with urllib.request.urlopen(request, timeout=120) as response:
                      data = response.read()
                  if not data:
                      raise ValueError("empty download")
                  destination.mkdir(parents=True, exist_ok=True)
                  if zipfile.is_zipfile(io.BytesIO(data)):
                      extract_zip(data, destination)
                  else:
                      extract_tar(data, destination)
                  successful.append(item)
              except Exception as exc:
                  print(f"Skipping {name}@{version}: artifact could not be extracted safely: {exc}")
                  import shutil
                  shutil.rmtree(destination, ignore_errors=True)

          metadata["packages"] = successful
          metadata_path.write_text(json.dumps(metadata, indent=2) + "\n", encoding="utf-8")
          print(f"Successfully extracted {len(successful)}/{len(targets)} PyPI package releases.")
          print("PyPI package extraction complete. Package code was not executed.")
          PY

      - name: Run PyPI static analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTHTICS_ECOSYSTEM: pypi
        run: python3 scripts/run_gemini_analyze.py

      - name: Classify CWE proposals
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTHTICS_ECOSYSTEM: pypi
        run: python3 scripts/classify_cwe.py

      - name: Check for actionable findings
        id: findings
        run: |
          if find findings/pypi -type f -name 'AUTH-*.json' -print -quit 2>/dev/null | grep -q .; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
            echo "No actionable PyPI findings. No report, commit, or PR will be created."
          fi

      - name: Create draft PR
        if: steps.findings.outputs.has_findings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="authtics/pypi-daily-scan-${GITHUB_RUN_ID}"
          git config user.name "authtics-bot"
          git config user.email "authtics-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add findings/pypi reports metadata/pypi-recent-packages.json metadata/scan-state.json
          git diff --cached --quiet || git commit -m "scan: daily PyPI security analysis"
          git push origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "[PyPI] Daily security scan ${GITHUB_RUN_ID}" \
            --body "## Authtics PyPI security scan\n\nThis is an automated **AI draft** for human review.\n\n- Ecosystem: PyPI\n- Package code was not executed.\n- Only exact analyzed releases are affected.\n- \\`n/a\\` results do not create advisories.\n- CWE classifications are AI-proposed and require human verification.\n- No advisory is considered published until the human review gate approves it."
